    <section id="islerimiz" class="section section-gray" aria-labelledby="work-title">
      <div class="wrap">
        <div class="section-head"><h2 id="work-title">{{workTitle}}</h2></div>
        <div class="work-track service-work"><div class="work-row">{{workItems}}</div></div>
      </div>
    </section>

    <section id="yorumlar" class="section" aria-labelledby="reviews-title">
      <div class="wrap">
        <div class="section-head"><h2 id="reviews-title">Müşteri yorumları</h2><p>Pencere, kapı ve sineklik işlerimizden.</p></div>
        <div class="review-track">{{reviewsFeatured}}</div>
        <a class="faq-more" href="/#yorumlar">Tüm yorumları oku</a>
      </div>
    </section>

    <section id="sorular" class="section section-gray" aria-labelledby="faq-title">
      <div class="wrap faq"><h2 id="faq-title">{{faqTitle}}</h2><div class="faq-items">{{faq}}</div></div>
    </section>
